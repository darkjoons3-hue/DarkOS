name: Build DarkOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install NASM
      run: sudo apt-get update && sudo apt-get install -y nasm

    - name: Build OS Image
      run: make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: darkos-image
        path: darkos.img
